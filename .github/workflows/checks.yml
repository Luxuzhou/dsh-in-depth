name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra docs
      - run: uv run python scripts/check_content.py
      - run: uv run python labs/lab04-governed-data-agent/test_mock_data_agent.py
      - run: uv run mkdocs build --strict
